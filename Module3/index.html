<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 3 - Crypto RBAC App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .hidden { display: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-3xl font-bold text-center mb-8 text-indigo-700">Module 3 - Authentication & Cryptography</h1>

  <!-- Login / Register -->
  <div id="auth-section">
    <div class="grid grid-cols-2 gap-6">
      <!-- Login -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-semibold mb-4">Login</h2>
        <input id="login-username" type="text" placeholder="Username" class="w-full p-3 border rounded mb-3">
        <input id="login-password" type="password" placeholder="Password" class="w-full p-3 border rounded mb-3">
        <button onclick="login()" class="w-full bg-indigo-600 text-white py-3 rounded hover:bg-indigo-700">Login</button>
      </div>

      <!-- Register -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-semibold mb-4">Register</h2>
        <input id="reg-username" type="text" placeholder="Username" class="w-full p-3 border rounded mb-3">
        <input id="reg-password" type="password" placeholder="Password" class="w-full p-3 border rounded mb-3">
        <select id="reg-role" class="w-full p-3 border rounded mb-3">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
        <button onclick="register()" class="w-full bg-green-600 text-white py-3 rounded hover:bg-green-700">Register</button>
      </div>
    </div>
  </div>

  <!-- Main App (after login) -->
  <div id="app-section" class="hidden">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">Welcome, <span id="username" class="text-indigo-600"></span>!</h2>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Caesar Cipher -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="font-semibold mb-3">4.1 Caesar Cipher</h3>
        <textarea id="caesar-msg" class="w-full p-3 border rounded mb-3" rows="3" placeholder="Enter message"></textarea>
        <input id="caesar-shift" type="number" value="3" class="w-24 p-3 border rounded mb-3">
        <div class="flex gap-3">
          <button onclick="caesarAction('encrypt')" class="flex-1 bg-blue-600 text-white py-2 rounded">Encrypt</button>
          <button onclick="caesarAction('decrypt')" class="flex-1 bg-purple-600 text-white py-2 rounded">Decrypt</button>
        </div>
        <p id="caesar-result" class="mt-4 font-mono text-sm"></p>
      </div>

      <!-- SHA-256 Hash -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="font-semibold mb-3">4.2 SHA-256 Hash</h3>
        <textarea id="hash-text" class="w-full p-3 border rounded mb-3" rows="3" placeholder="Text to hash"></textarea>
        <button onclick="hashText()" class="w-full bg-teal-600 text-white py-3 rounded">Generate SHA-256 Hash</button>
        <p id="hash-result" class="mt-4 font-mono break-all text-sm"></p>
      </div>

      <!-- Digital Signature -->
      <div class="bg-white p-6 rounded-lg shadow md:col-span-2">
        <h3 class="font-semibold mb-3">4.3 Digital Signature (RSA)</h3>
        <textarea id="sign-data" class="w-full p-3 border rounded mb-3" rows="3" placeholder="Data to sign"></textarea>
        <div class="flex gap-3">
          <button onclick="signData()" class="flex-1 bg-orange-600 text-white py-3 rounded">Sign Data</button>
          <button onclick="verifySignature()" class="flex-1 bg-emerald-600 text-white py-3 rounded">Verify Signature</button>
        </div>
        <div id="sign-result" class="mt-4 text-sm"></div>
      </div>

    </div>

    <div class="text-center mt-8 text-gray-500 text-sm">
      Token: <span id="token-display" class="font-mono break-all"></span>
    </div>
  </div>
</div>

<script>
// Global variables
let token = '';
let currentUser = '';

// Login
async function login() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;

  const res = await fetch('http://localhost:3000/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();
  if (data.token) {
    token = data.token;
    currentUser = username;
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    document.getElementById('username').textContent = username;
    document.getElementById('token-display').textContent = token.substring(0, 30) + '...';
    alert('Login successful!');
  } else {
    alert(data.error || 'Login failed');
  }
}

// Register
async function register() {
  const username = document.getElementById('reg-username').value;
  const password = document.getElementById('reg-password').value;
  const role = document.getElementById('reg-role').value;

  const res = await fetch('http://localhost:3000/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password, role })
  });

  const data = await res.json();
  alert(data.message || data.error);
}

// Caesar Cipher
async function caesarAction(action) {
  const message = document.getElementById('caesar-msg').value;
  const shift = document.getElementById('caesar-shift').value;

  const res = await fetch('http://localhost:3000/protected/caesar', {
    method: 'POST',
    headers: { 
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ message, shift, action })
  });

  const data = await res.json();
  document.getElementById('caesar-result').innerHTML = `<strong>Result:</strong> ${data.result}`;
}

// Hash Text
async function hashText() {
  const text = document.getElementById('hash-text').value;

  const res = await fetch('http://localhost:3000/protected/hash-text', {
    method: 'POST',
    headers: { 
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ text })
  });

  const data = await res.json();
  document.getElementById('hash-result').innerHTML = `<strong>SHA-256:</strong><br>${data.sha256}`;
}

// Sign & Verify
let lastSignature = '';
let lastPublicKey = '';

async function signData() {
  const data = document.getElementById('sign-data').value;

  const res = await fetch('http://localhost:3000/protected/sign', {
    method: 'POST',
    headers: { 
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ data })
  });

  const result = await res.json();
  lastSignature = result.signature;
  lastPublicKey = result.publicKey;

  document.getElementById('sign-result').innerHTML = `
    <strong>Signature Created!</strong><br>
    <span class="text-xs text-gray-600">Copy this signature for verification:</span><br>
    <span class="font-mono text-xs break-all">${lastSignature}</span>
  `;
}

async function verifySignature() {
  const data = document.getElementById('sign-data').value;

  const res = await fetch('http://localhost:3000/protected/verify', {
    method: 'POST',
    headers: { 
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ 
      data, 
      signature: lastSignature, 
      publicKey: lastPublicKey 
    })
  });

  const result = await res.json();
  alert(result.valid ? "✅ Signature is VALID!" : "❌ Signature is INVALID!");
}

// Logout
function logout() {
  token = '';
  document.getElementById('app-section').classList.add('hidden');
  document.getElementById('auth-section').classList.remove('hidden');
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
}
</script>

</body>
</html>
